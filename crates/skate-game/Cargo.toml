[package]
name = "skate-game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "skate3rust"
path = "src/main.rs"

[[bin]]
name = "skate3-multiplayer"
path = "src/multiplayer_main.rs"
test = false

[[bin]]
name = "skate3-custom-models"
path = "src/custom_models_main.rs"
test = false

[features]
default = ["dev-dynamic", "brp"]
dev-dynamic = ["bevy/dynamic_linking"]
# Bevy Remote Protocol on 127.0.0.1:15702 (BRP_EXTRAS_PORT overrides) for the
# bevy_brp_mcp agent tools: inspect entities, screenshots, keyboard/mouse input.
brp = ["dep:bevy_brp_extras"]

[dependencies]
bevy = { workspace = true, features = ["jpeg", "trace", "debug"] }
tracing-log = "0.2"
skate-core.workspace = true
skate-data.workspace = true
half = "=2.7.1"
serde_json.workspace = true
serde.workspace = true
skate-mods = { path = "../skate-mods" }

skate-vehicles = { path = "../skate-vehicles" }
skate-net = { path = "../skate-net" }
bevy_brp_extras = { version = "=0.19.0", optional = true }
blake3 = "=1.8.7"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in"] }
naga_oil = { version = "=0.20.0", default-features = false }
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "naga-ir"] }
